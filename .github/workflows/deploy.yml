name: Deploy to GitHub Pages

# GitHub Pages is a static host: it cannot run `npm run build`, and it cannot
# execute the TypeScript in src/. This workflow builds the site on every push
# to main and publishes the compiled output in dist/.
#
# One-time setup: Settings → Pages → Build and deployment → Source →
# **GitHub Actions**. (Not "Deploy from a branch".)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # vite.config.ts derives the base path from GITHUB_REPOSITORY, so the
      # build knows it is served from /<repo>/ without any hard-coded value.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
